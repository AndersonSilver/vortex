name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @vortex/shared build

      - name: Typecheck shared
        run: pnpm --filter @vortex/shared typecheck

      - name: Typecheck api
        run: pnpm --filter @vortex/api typecheck

      - name: Typecheck web
        run: pnpm --filter @vortex/web typecheck
